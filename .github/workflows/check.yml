name: Windows desktop pet checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate assets and interaction behavior
        shell: powershell
        run: ./tests/test-xuewang-dynamic.ps1
      - name: Build clean preview archive
        shell: powershell
        run: ./build-release.ps1 -OutputDirectory ./release
      - uses: actions/upload-artifact@v4
        with:
          name: snowcourt-preview
          path: release/*
